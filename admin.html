<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Brothers Christmas — Applicant Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#ffffff; --card:#ffffff; --card2:#f0f7f3;
    --gold:#2f8f5b; --gold-dim:#1f6b43; --green:#1b5e3a; --red:#c0433f;
    --text:#173829; --dim:#5a7d6c; --line:rgba(27,94,58,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Inter',sans-serif; color:var(--text);
    background:
      radial-gradient(circle at 15% 0%, rgba(47,143,91,0.05), transparent 45%),
      var(--bg);
    padding:22px 16px 60px;
  }
  .wrap{ max-width:960px; margin:0 auto; }

  .logo{ width:48px; height:auto; border-radius:8px; }
  header{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .header-left{ display:flex; align-items:center; gap:12px; }
  .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-dim); font-weight:700; margin-bottom:4px;}
  h1{ font-family:'Fraunces',serif; font-size:24px; margin:0; }
  .refresh-btn{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer; font-weight:600;
  }

  /* Key gate */
  .gate{
    max-width:400px; margin:80px auto; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:26px; text-align:center; box-shadow:0 4px 20px rgba(27,94,58,0.08);
  }
  .gate h2{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 6px;}
  .gate p{ color:var(--dim); font-size:13px; margin:0 0 16px;}
  .gate input{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:15px; margin-bottom:10px;
  }
  .gate button{
    width:100%; padding:12px; border:none; border-radius:9px; font-weight:700;
    background:linear-gradient(90deg, var(--gold-dim), var(--gold)); color:#ffffff; cursor:pointer;
  }
  .gate .err{ color:var(--red); font-size:12.5px; margin-top:8px; display:none; }

  /* Stats */
  .stats{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card{
    flex:1; min-width:120px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; box-shadow:0 2px 10px rgba(27,94,58,0.06);
  }
  .stat-label{ font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .stat-val{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; }
  .stat-val.green{ color:var(--green); }
  .stat-val.gold{ color:var(--gold); }

  /* Controls */
  .controls{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .controls input, .controls select{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13.5px;
  }
  .controls input{ flex:1; min-width:160px; }
  .checkbox-filter{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); }
  .checkbox-filter input{ padding:0; width:16px; height:16px; accent-color:var(--gold); }

  /* Applicant cards */
  .applicant{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 10px rgba(27,94,58,0.06);
  }
  .app-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; }
  .app-name{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
  .app-meta{ font-size:12px; color:var(--dim); margin-top:2px; }
  .status-badge{
    font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .status-New{ background:#eef1f6; color:#3d4f66; }
  .status-Contacted{ background:#eaf4ee; color:var(--gold-dim); }
  .status-Screened{ background:#e7f2f6; color:#1f6b82; }
  .status-Hired{ background:#e3f3e9; color:var(--green); }
  .status-Rejected{ background:#fbe9e8; color:var(--red); }

  .checks{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip{
    font-size:11px; padding:4px 9px; border-radius:20px; font-weight:600;
    background:var(--card2); color:var(--dim); border:1px solid var(--line);
  }
  .chip.yes{ color:var(--green); border-color:rgba(79,174,124,0.3); }
  .chip.no{ color:var(--red); border-color:rgba(224,97,107,0.25); opacity:.7; }

  .details{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .details.open{ display:block; }
  .detail-row{ font-size:13px; margin-bottom:6px; color:var(--dim); }
  .detail-row b{ color:var(--text); font-weight:600; }

  .actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .actions select{
    background:var(--card2); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:8px; font-size:13px;
  }

  .empty{ text-align:center; color:var(--dim); padding:50px 20px; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate" class="gate">
    <h2>Admin Dashboard</h2>
    <p>Enter your admin key to view applicants</p>
    <input type="password" id="keyInput" placeholder="Admin key">
    <button onclick="unlock()">Unlock</button>
    <div class="err" id="gateErr">Invalid key or connection issue — check WEB_APP_URL in the code.</div>
  </div>

  <div id="dashboard" style="display:none;">
    <header>
      <div class="header-left">
        <img class="logo" src="https://www.twobrotherschristmas.com/wp-content/uploads/2020/08/d418014b-3292-41a9-921a-62b2b7ec073b-262x201.png" alt="Two Brothers Christmas logo">
        <div>
          <div class="eyebrow">Two Brothers Christmas</div>
          <h1>Applicant Dashboard</h1>
        </div>
      </div>
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Applicants</div>
        <div class="stat-val" id="statTotal">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fully Qualified</div>
        <div class="stat-val green" id="statQualified">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hired</div>
        <div class="stat-val gold" id="statHired">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">New / Unscreened</div>
        <div class="stat-val" id="statNew">–</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search by name..." oninput="render()">
      <select id="statusFilter" onchange="render()">
        <option value="">All statuses</option>
        <option>New</option>
        <option>Contacted</option>
        <option>Screened</option>
        <option>Hired</option>
        <option>Rejected</option>
      </select>
      <label class="checkbox-filter">
        <input type="checkbox" id="qualifiedOnly" onchange="render()">
        Fully qualified only
      </label>
    </div>

    <div id="list"></div>
  </div>

</div>

<script>
  // ---- CONFIG ----
  // Paste your Apps Script Web App URL here after deploying (see README.md)
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzeXh5cLUC07sZV3xwLmLAEcLCRawEMnhX5wnh3vne9kx3vz3JuCgy-pyEUAasG8OZF/exec";
  // ----------------

  let adminKey = localStorage.getItem('crewAdminKey') || '';
  let applicants = [];

  function unlock() {
    const val = document.getElementById('keyInput').value.trim();
    if (!val) return;
    adminKey = val;
    localStorage.setItem('crewAdminKey', adminKey);
    loadData();
  }

  async function loadData() {
    try {
      const res = await fetch(`${WEB_APP_URL}?key=${encodeURIComponent(adminKey)}`);
      const data = await res.json();
      if (data.error) {
        document.getElementById('gateErr').textContent = data.error;
        document.getElementById('gateErr').style.display = 'block';
        document.getElementById('gate').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        return;
      }
      applicants = data.applicants || [];
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      render();
    } catch (err) {
      document.getElementById('gateErr').textContent = 'Could not connect. Check WEB_APP_URL in the code.';
      document.getElementById('gateErr').style.display = 'block';
    }
  }

  function isQualified(a) {
    return a.ValidLicense === true && a.Lift50 === true && a.RoofsLadders === true &&
           a.WorkDays === true && a.WorkHours === true && a.Transportation === true;
  }

  function render() {
    const search = document.getElementById('searchBox').value.toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    const qualifiedOnly = document.getElementById('qualifiedOnly').checked;

    let filtered = applicants.filter(a => {
      if (search && !(a.Name || '').toLowerCase().includes(search)) return false;
      if (statusFilter && a.Status !== statusFilter) return false;
      if (qualifiedOnly && !isQualified(a)) return false;
      return true;
    });

    // Stats always computed off full set, not filtered
    document.getElementById('statTotal').textContent = applicants.length;
    document.getElementById('statQualified').textContent = applicants.filter(isQualified).length;
    document.getElementById('statHired').textContent = applicants.filter(a => a.Status === 'Hired').length;
    document.getElementById('statNew').textContent = applicants.filter(a => a.Status === 'New').length;

    const list = document.getElementById('list');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No applicants match these filters.</div>';
      return;
    }

    list.innerHTML = filtered.map((a, i) => {
      const checks = [
        ['Valid license', a.ValidLicense],
        ['Lift 50 lbs', a.Lift50],
        ['Roofs/ladders', a.RoofsLadders],
        ['5–6 days/wk', a.WorkDays],
        ['8–10 hr days', a.WorkHours],
        ['Transportation', a.Transportation]
      ];
      const chipHtml = checks.map(([label, val]) =>
        `<span class="chip ${val ? 'yes' : 'no'}">${val ? '✓' : '✕'} ${label}</span>`
      ).join('');

      const statusOptions = ['New','Contacted','Screened','Hired','Rejected']
        .map(s => `<option value="${s}" ${a.Status === s ? 'selected' : ''}>${s}</option>`).join('');

      return `
        <div class="applicant">
          <div class="app-top" onclick="toggleDetails('${a.ID}')">
            <div>
              <div class="app-name">${escapeHtml(a.Name || 'Unnamed')}</div>
              <div class="app-meta">License: ${escapeHtml(a.LicenseState || '?')} · Applied ${formatDate(a.Timestamp)}</div>
            </div>
            <span class="status-badge status-${a.Status}">${a.Status}</span>
          </div>
          <div class="checks">${chipHtml}</div>
          <div class="details" id="details-${a.ID}">
            <div class="detail-row"><b>Address:</b> ${escapeHtml(a.Address || '—')}</div>
            <div class="detail-row"><b>License State:</b> ${escapeHtml(a.LicenseState || '—')}</div>
            <div class="detail-row"><b>Notes:</b> ${escapeHtml(a.Notes || '—')}</div>
            <div class="actions">
              <select onchange="updateStatus('${a.ID}', this.value)">${statusOptions}</select>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDetails(id) {
    document.getElementById(`details-${id}`).classList.toggle('open');
  }

  async function updateStatus(id, status) {
    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateStatus', key: adminKey, id, status })
      });
      const a = applicants.find(x => x.ID === id);
      if (a) a.Status = status;
      render();
    } catch (err) {
      alert('Could not update status. Check your connection and try again.');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString();
  }

  // Auto-unlock if key already saved
  if (adminKey) loadData();
</script>
</body>
</html>
